buildscript {
    configurations.classpath {
        resolutionStrategy {
            // JReleaser needs JGit 5.13.x, Spotless pulls in 7.x: https://github.com/jreleaser/jreleaser/issues/1643
            // Latest 5.13.x, so CVE-2023-4759 is fixed.
            force 'org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r'
        }
    }

    // Last-resort pins for the build classpath (plugins only, not the published libraries).
    dependencies {
        constraints {
            classpath('org.codehaus.plexus:plexus-utils:3.6.1') {
                because 'GHSA-6fmv-xxpf-w3cw. Remove when jreleaser-gradle-plugin pulls in plexus-utils >= 3.6.1'
            }
        }
    }
}

plugins {
    id 'base'
    id 'org.jreleaser' version "1.27.0"
    id 'io.github.ben-manes.versions' version '0.67.0' apply false
    id "com.github.spotbugs" version "6.5.13" apply false
    id 'com.diffplug.spotless' version "8.9.0" apply false
    id 'org.springframework.boot' version "4.1.2" apply false
}

subprojects {
    ext {
        auth0JavaVersion = '2.27.0'
        guavaVersion = '33.8.0-jre'
    }
}

jreleaser {
    signing {
        active = 'ALWAYS'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                release {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                }
            }
            nexus2 {
                snapshot {
                    active = 'SNAPSHOT'
                    applyMavenCentralRules = true
                    snapshotSupported = true
                    closeRepository = true
                    releaseRepository = true
                    url = "https://ossrh-staging-api.central.sonatype.com/service/local"
                    snapshotUrl = 'https://central.sonatype.com/repository/maven-snapshots/'
                    stagingRepository('build/staging-deploy')
                }
            }
        }
    }
    release {
        github {
            enabled = true
        }
    }
}
