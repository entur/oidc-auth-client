import static org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES

plugins {
    id 'oidcAuth.java-conventions'
    id 'oidcAuth.library-conventions'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    api(platform(BOM_COORDINATES))

    api project(":oidc-client")
    api("com.auth0:auth0:${auth0JavaVersion}")

    compileOnly("org.springframework.boot:spring-boot-starter-web")
    compileOnly("org.springframework.boot:spring-boot-starter-restclient")

    // Dependencies required to run tests
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-starter-webmvc-test")
    testImplementation("org.springframework.boot:spring-boot-starter-restclient-test")

    constraints {
        api('org.apache.tomcat.embed:tomcat-embed-core') {
            version { require '11.0.25' }
            because 'Fixes CVE-2026-65905, CVE-2026-68525 and CVE-2026-65182'
        }
        // Jackson 2 comes in via auth0; the Spring Boot BOM manages 2.21.5.
        api('com.fasterxml.jackson.core:jackson-databind') {
            version { require '2.21.7' }
            because 'Fixes CVE-2026-19032, CVE-2026-68497, CVE-2026-83557, CVE-2026-91776 and CVE-2026-91777. Remove when the Spring Boot BOM manages >= 2.21.7'
        }
        api('com.fasterxml.jackson.core:jackson-core') {
            version { require '2.21.7' }
            because 'Fixes CVE-2026-89407 and CVE-2026-89425. Remove when the Spring Boot BOM manages >= 2.21.7'
        }
        // Jackson 3 comes in via the Spring Boot starters; the Spring Boot BOM manages 3.1.5.
        api('tools.jackson.core:jackson-databind') {
            version { require '3.1.7' }
            because 'Fixes CVE-2026-19032, CVE-2026-68497, CVE-2026-83557, CVE-2026-91776 and CVE-2026-91777. Remove when the Spring Boot BOM manages >= 3.1.7'
        }
        api('tools.jackson.core:jackson-core') {
            version { require '3.1.7' }
            because 'Fixes CVE-2026-89407 and CVE-2026-89425. Remove when the Spring Boot BOM manages >= 3.1.7'
        }
    }
}

spotbugs {
    excludeFilter = file("$projectDir/spotbugs-exclude.xml")
}
